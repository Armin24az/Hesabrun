<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hesabrun | حساب‌رون</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#073724">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hesabrun">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<style>
@font-face{font-family:Vazirmatn;src:url(vazirmatn.woff2) format('woff2');font-weight:100 900;font-display:swap}
:root{--bg:#052b1b;--bg2:#073724;--card:#0d4a31;--card2:#09402a;--tx:#f3ead6;--mut:#9fbdaa;--gold:#e6bd66;--gold2:#c99a3a;--pri:#e6bd66;--ok:#6ee7a0;--bad:#ff7b72;--warn:#f0b34a;--line:rgba(230,189,102,.18)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:radial-gradient(120% 60% at 50% 0,#0b4a31 0,var(--bg) 70%) fixed;color:var(--tx);font-family:Vazirmatn,Tahoma,system-ui,sans-serif;padding-bottom:100px;padding-top:env(safe-area-inset-top);min-height:100vh}
header{padding:14px 16px 64px;display:flex;align-items:center;justify-content:space-between}
header h1{margin:0;font-size:18px;color:var(--gold);display:flex;align-items:center;gap:8px;letter-spacing:.3px}
header h1 img{width:30px;height:30px;border-radius:8px}
.nav{display:flex;align-items:center;gap:8px}
.nav button{background:linear-gradient(#134f37,#0a3a27);color:var(--gold);border:1px solid var(--line);border-radius:11px;width:36px;height:36px;font-size:19px;box-shadow:0 3px 0 #04210f,0 6px 10px rgba(0,0,0,.35)}
.nav button:active{transform:translateY(3px);box-shadow:0 0 0 #04210f}
main{max-width:640px;margin:-48px auto 0;padding:0 12px}
.card{background:linear-gradient(160deg,var(--card),var(--card2));border:1px solid var(--line);border-radius:20px;padding:14px;margin-bottom:14px;
box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 5px 0 #04210f,0 14px 24px rgba(0,0,0,.4)}
.card h2{margin:0 0 10px;font-size:15px;color:var(--gold)}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:12px;perspective:800px}
.sum div{border-radius:16px;padding:12px;transition:transform .2s;transform:rotateX(4deg)}
.sum small{display:block;font-size:12px;opacity:.85}
.sum b{font-size:18px}
.sum .inc{background:linear-gradient(150deg,#f3d38a,var(--gold2));color:#2c2105;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),0 6px 0 #8a6a1d,0 14px 20px rgba(0,0,0,.45)}
.sum .exp{background:linear-gradient(150deg,#fbf4e2,#d9ccaa);color:#10321f;box-shadow:inset 0 2px 0 #fff,0 6px 0 #8f8461,0 14px 20px rgba(0,0,0,.45)}
.sum .left{grid-column:1/-1;text-align:center;padding:16px;transform:none;background:linear-gradient(160deg,#0f5d3d,#06301f);border:1px solid var(--gold);
box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -10px 24px rgba(0,0,0,.35),0 6px 0 #03180d,0 16px 26px rgba(0,0,0,.5),0 0 18px rgba(230,189,102,.2)}
.sum .left b{font-size:30px}
.sum .left small{color:var(--mut)}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.bar{height:11px;background:rgba(0,0,0,.35);border-radius:8px;overflow:hidden;margin-top:10px;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.bar i{display:block;height:100%;background:linear-gradient(var(--gold),var(--gold2));border-radius:8px;box-shadow:0 0 8px rgba(230,189,102,.6)}
.item{display:flex;align-items:center;gap:8px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-of-type{border-top:0}
.item .nm{flex:1;min-width:0}
.item .nm span{display:block;font-size:12px;color:var(--mut)}
.item button{background:none;border:0;color:var(--mut);font-size:18px;padding:4px 8px}
.tag{display:inline-block;font-style:normal;font-size:11px;border-radius:8px;padding:1px 7px;margin-inline-end:4px;background:rgba(255,255,255,.1)}
.tag.n0{background:#1c6b45;color:#c9f5dc}.tag.n1{background:#7a5a14;color:#ffe6a8}.tag.n2{background:#7c2a26;color:#ffd0cc}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
input,select{width:100%;padding:11px;border:1px solid var(--line);border-radius:12px;background:#06301f;color:var(--tx);font:inherit;box-shadow:inset 0 2px 4px rgba(0,0,0,.4)}
input:focus,select:focus{outline:2px solid var(--gold)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{width:100%;margin-top:14px;padding:13px;border:0;border-radius:14px;background:linear-gradient(#f0cc7b,var(--gold2));color:#2c2105;font:inherit;font-weight:700;box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 4px 0 #7d5f17,0 8px 14px rgba(0,0,0,.4)}
.btn:active{transform:translateY(4px);box-shadow:inset 0 2px 0 rgba(255,255,255,.5),0 0 0 #7d5f17}
.btn.sec{background:linear-gradient(#14593d,#0a3a27);color:var(--tx);border:1px solid var(--line);margin-top:10px;box-shadow:0 4px 0 #04210f,0 8px 14px rgba(0,0,0,.35)}
.fab{position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:18px;width:60px;height:60px;border-radius:50%;border:0;background:radial-gradient(circle at 35% 30%,#f7dc95,var(--gold2));color:#2c2105;font-size:32px;box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 5px 0 #7d5f17,0 12px 20px rgba(0,0,0,.5)}
.fab:active{transform:translateY(5px);box-shadow:0 0 0 #7d5f17}
dialog{border:1px solid var(--gold);border-radius:20px;padding:16px;width:min(92vw,420px);background:linear-gradient(160deg,var(--card),var(--bg2));color:var(--tx);box-shadow:0 20px 50px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog h2{color:var(--gold)}
.tip{padding:10px 12px;border-radius:12px;background:rgba(0,0,0,.25);margin-bottom:8px;font-size:14px;line-height:1.8;border-inline-start:4px solid var(--gold)}
.tip.w{border-color:var(--warn)}.tip.b{border-color:var(--bad)}.tip.g{border-color:var(--ok)}
.empty{color:var(--mut);text-align:center;padding:12px;font-size:14px}
#install{display:none}
.chart{width:100%;height:auto;display:block;direction:ltr}
.chart text{fill:var(--mut);font-size:10px;font-family:inherit}
.ev{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.ev span:first-child{color:var(--gold);white-space:nowrap}
.cat{display:flex;justify-content:space-between;font-size:13px;margin-top:8px}
dialog{margin:auto auto 0;max-width:520px;width:100%;border-radius:26px 26px 0 0;border-bottom:0;animation:up .32s cubic-bezier(.2,.9,.3,1)}
dialog::backdrop{animation:fadeb .3s}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeb{from{opacity:0}}
dialog::before{content:"";display:block;width:44px;height:5px;border-radius:3px;background:var(--line);margin:-6px auto 10px}
button,.btn,input,select{min-height:44px}
.sum .left.ok{border-color:var(--ok);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -10px 24px rgba(0,0,0,.35),0 6px 0 #03180d,0 16px 26px rgba(0,0,0,.5),0 0 22px rgba(110,231,160,.35)}
.sum .left.warn{border-color:var(--warn);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -10px 24px rgba(0,0,0,.35),0 6px 0 #03180d,0 16px 26px rgba(0,0,0,.5),0 0 22px rgba(240,179,74,.35)}
.sum .left.bad{border-color:var(--bad);box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -10px 24px rgba(0,0,0,.35),0 6px 0 #03180d,0 16px 26px rgba(0,0,0,.5),0 0 22px rgba(255,123,114,.4)}
.mon{font-size:12px;color:var(--mut);margin-top:8px}
.mon .bar{height:6px;margin-top:4px}
.mon .bar i{background:linear-gradient(#9fbdaa,#6c8f7a);box-shadow:none}
#toast{position:fixed;left:50%;bottom:92px;transform:translate(-50%,30px);opacity:0;pointer-events:none;background:#f3ead6;color:#10321f;border-radius:14px;padding:10px 16px;font-size:14px;display:flex;gap:14px;align-items:center;transition:.3s;z-index:60;box-shadow:0 8px 20px rgba(0,0,0,.5)}
#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
#toast button{background:none;border:0;color:#0b6b3f;font:inherit;font-weight:700;min-height:0;padding:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.stats div{background:rgba(0,0,0,.25);border-radius:14px;padding:10px 6px;text-align:center;box-shadow:inset 0 2px 4px rgba(0,0,0,.35)}
.stats small{display:block;font-size:11px;color:var(--mut)}.stats b{font-size:15px}
.verdict{padding:12px;border-radius:14px;margin-bottom:12px;line-height:1.9;font-size:14px;background:rgba(0,0,0,.25);border-inline-start:5px solid var(--gold)}
.verdict.g{border-color:var(--ok)}.verdict.w{border-color:var(--warn)}.verdict.b{border-color:var(--bad)}
.plan h3{font-size:13px;color:var(--gold);margin:12px 0 6px}
.step{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:7px 0;border-top:1px solid var(--line)}
.step em{font-style:normal;color:var(--ok);white-space:nowrap}
.split{display:flex;height:14px;border-radius:8px;overflow:hidden;margin:6px 0;box-shadow:inset 0 2px 4px rgba(0,0,0,.5)}
.split i{display:block;height:100%}
.leg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--mut)}
.leg b{display:inline-block;width:9px;height:9px;border-radius:50%;margin-inline-end:4px}
.donut{display:block;margin:0 auto 6px;width:170px;height:170px}
.donut text{fill:var(--tx);font-size:13px;font-family:inherit;text-anchor:middle}
.card{animation:rise .5s both}.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.slide{animation:sl .3s}
@keyframes sl{from{opacity:.2;transform:translateX(var(--dx,20px))}}
/* splash */
#splash{position:fixed;inset:0;z-index:99;background:#073724;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;transition:opacity .5s,visibility .5s}
#splash.hide{opacity:0;visibility:hidden}
#splash img{width:min(72vw,340px);animation:pop .9s cubic-bezier(.2,.9,.3,1.2) both}
#splash .track{width:min(56vw,220px);height:12px;border:2px solid var(--gold);border-radius:10px;padding:2px;animation:pop .9s .2s both}
#splash .track i{display:block;height:100%;width:0;border-radius:6px;background:linear-gradient(var(--gold),var(--gold2));animation:fill 1.5s .3s ease-in-out forwards}
@keyframes pop{from{opacity:0;transform:scale(.8)}to{opacity:1;transform:none}}
@keyframes fill{to{width:100%}}
.crow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}.crow i{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-style:normal;font-size:18px}.crow span{flex:1}.crow button{min-width:44px;background:none;border:0;color:var(--tx);font-size:16px}.crow2{display:grid;grid-template-columns:56px 1fr 56px;gap:8px;margin-top:10px}.crow2 input[type=color]{padding:3px}
</style>
</head>

<main>
  <section class="card">
    <div class="sum">

      <div class="exp"><small>مجموع هزینه‌ها</small><b id="sExp">0</b></div>
      <div class="left"><small>باقی‌مانده</small><b id="sLeft">0</b>
        <div class="bar"><i id="sBar" style="width:0"></i></div>
        <small id="sPct"></small><div class="mon" id="mon"></div></div>
    </div>
    <button class="btn sec" id="editInc">ثبت / ویرایش درآمد این ماه</button>
  </section>

  <section class="card"><h2>📉 روند حساب این ماه</h2><div id="chart"></div><div id="evs"></div></section>

  <section class="card plan"><h2>🧮 تحلیل دقیق این ماه</h2><div id="ana"></div></section>
  <section class="card"><h2>💡 هشدارها و نکته‌ها</h2><div id="tips"></div></section>

  <section class="card"><h2>هزینه‌های این ماه</h2><div id="list"></div></section>

  <section class="card"><h2>سهم دسته‌ها</h2><div id="cats"></div></section>

  <section class="card">
    <h2>تنظیمات</h2>

    <input id="goal" type="number" inputmode="numeric" min="0" max="90">
    <button class="btn sec" id="manCats">مدیریت دسته‌بندی‌ها</button>
    <button class="btn sec" id="export">دریافت پشتیبان (JSON)</button>
    <button class="btn sec" id="import">بازیابی پشتیبان</button>
    <input type="file" id="file" accept="application/json" hidden>
    <button class="btn" id="install">📲 نصب روی صفحه اصلی</button>
    <p id="iosHint" class="empty" style="display:none">آیفون: دکمه Share ← Add to Home Screen</p>

</main>

<dialog id="dlg">

    <label>مبلغ (تومان)</label><input id="fAmt" required inputmode="numeric" placeholder="۱٬۰۰۰٬۰۰۰">
    <div class="row">
      <div><label>دسته</label>
        <select id="fCat"></select></div>
      <div><label>اهمیت</label>
        <select id="fNeed"><option value="0">ضروری</option><option value="1">نیمه‌ضروری</option><option value="2">قابل حذف</option></select></div>
    </div>
    <label>روز ماه (تاریخ خرج)</label><input id="fDay" type="number" inputmode="numeric" min="1" max="31">
    <div class="row">
      <div><label>تکرار</label>
        <select id="fRep"><option value="1">فقط این ماه</option><option value="0">هر ماه (ثابت)</option><option value="n">قسط (چند ماه)</option></select></div>
      <div id="nBox" style="display:none"><label>تعداد ماه‌ها</label><input id="fN" type="number" inputmode="numeric" min="2" value="12"></div>

</dialog>

  <button class="btn" type="button" id="cSave">افزودن</button>

    <button class="btn" type="submit">ذخیره</button>
  </form>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const KEY = "hesabrun.v1";
const MONTHS = ["فروردین","اردیبهشت","خرداد","تیر","مرداد","شهریور","مهر","آبان","آذر","دی","بهمن","اسفند"];
const NEED = ["ضروری", "نیمه‌ضروری", "قابل حذف"];

let db = JSON.parse(localStorage.getItem(KEY) || "null") || { items: [], income: {}, goal: 20 };
const DEFCATS = [["مسکن","🏠","#e6bd66"],["قسط و وام","🏦","#6ee7a0"],["خوراک","🍞","#7cc4ff"],["حمل‌ونقل","🚌","#ff9f7a"],["قبوض","💡","#c79bff"],["سلامت","💊","#f0e08a"],["تفریح و رستوران","🍽️","#5fd1c4"],["اشتراک و اپ","📱","#ff7b9c"],["خرید و پوشاک","🛍️","#a8b97a"],["سایر","📦","#9fbdaa"]];
if (!Array.isArray(db.cats)) db.cats = DEFCATS.map(([n,e,c]) => ({ n, e, c }));
const catOf = (n) => db.cats.find((c) => c.n === n) || { n, e: "📦", c: "#9fbdaa" };
const save = () => localStorage.setItem(KEY, JSON.stringify(db));

// ماه جاری شمسی -> شاخص (سال*12+ماه)
function nowIdx() {
  const p = new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", { year: "numeric", month: "numeric" }).formatToParts(new Date());
  return +p.find((x) => x.type === "year" || x.type === "relatedYear").value * 12 + (+p.find((x) => x.type === "month").value - 1);
}
let cur = nowIdx();
function todayDay() {
  const p = new Intl.DateTimeFormat("en-u-ca-persian-nu-latn", { day: "numeric" }).formatToParts(new Date());
  return +p.find((x) => x.type === "day").value;
}
const mLen = (i) => { const m = i % 12; return m < 6 ? 31 : m < 11 ? 30 : 29; };
const dayOf = (it) => Math.min(it.day || 1, 31);

function anim(el, to) {
  const from = el._v || 0; el._v = to; const t0 = performance.now();
  (function f(t) { const k = Math.min(1, (t - t0) / 600), e = 1 - Math.pow(1 - k, 3);
    el.textContent = fa(from + (to - from) * e); if (k < 1) requestAnimationFrame(f); })(t0);
}
const fa = (n) => Math.round(n).toLocaleString("fa-IR");
const toNum = (s) => +String(s).replace(/[۰-۹]/g, (d) => "۰۱۲۳۴۵۶۷۸۹".indexOf(d)).replace(/[٠-٩]/g, (d) => "٠١٢٣٤٥٦٧٨٩".indexOf(d)).replace(/[^\d]/g, "") || 0;
const mLabel = (i) => `${MONTHS[i % 12]} ${(Math.floor(i / 12)).toLocaleString("fa-IR", { useGrouping: false })}`;

// درآمد: آخرین مقدار ثبت‌شده تا این ماه (در صورت تکرار)
function incomeOf(idx) {
  if (db.income[idx]) return db.income[idx].main + db.income[idx].extra;
  const keys = Object.keys(db.income).map(Number).filter((k) => k < idx && db.income[k].carry).sort((a, b) => b - a);
  return keys.length ? db.income[keys[0]].main + db.income[keys[0]].extra : 0;
}
const inMonth = (it, idx) => idx >= it.start && (it.rep === 0 || idx < it.start + it.rep);
const monthItems = (idx) => db.items.filter((it) => inMonth(it, idx));

function render() {
  $("mname").textContent = mLabel(cur);
  const items = monthItems(cur), inc = incomeOf(cur);
  const exp = items.reduce((s, i) => s + i.amt, 0), left = inc - exp;
  anim($("sInc"), inc); anim($("sExp"), exp); anim($("sLeft"), left); $("sLeft").className = left < 0 ? "neg" : "pos";
  const pct = inc ? Math.min(100, (exp / inc) * 100) : 0;
  $("sBar").style.width = pct + "%"; $("sBar").style.background = pct > 100 || left < 0 ? "linear-gradient(var(--bad),#b3342c)" : pct > 85 ? "linear-gradient(var(--warn),#b57b1c)" : "";
  $("sPct").textContent = inc ? `${fa(exp / inc * 100)}٪ از درآمد خرج شده` : "ابتدا درآمد را ثبت کنید";
  $("goal").value = db.goal;
  const rate = inc ? left / inc * 100 : 0, L = $("sLeft").parentNode;
  L.className = "left " + (!inc ? "" : left < 0 ? "bad" : rate >= db.goal ? "ok" : "warn");
  if (cur === nowIdx()) { const td = todayDay(), ml = mLen(cur), rest = Math.max(1, ml - td + 1);
    $("mon").innerHTML = `روز ${fa(td)} از ${fa(ml)} ماه` + `<div class="bar"><i style="width:${td / ml * 100}%"></i></div>` + (inc && left > 0 ? `سقف خرج روزانه تا آخر ماه: <b>${fa(left / rest)}</b> تومان` : "");
  } else $("mon").innerHTML = "";

  $("list").innerHTML = items.length ? items.map((it) => {
    const sub = it.rep === 0 ? "ثابت ماهانه" : it.rep > 1 ? `قسط ${fa(cur - it.start + 1)} از ${fa(it.rep)}` : "یک‌باره";
    return `<div class="item"><div class="nm">${esc(it.name)}<span><i class="tag n${it.need}">${NEED[it.need]}</i>${catOf(it.cat).e} ${esc(it.cat)} · ${sub}</span></div>
      <b>${fa(it.amt)}</b><button data-e="${it.id}">✎</button><button data-d="${it.id}">🗑</button></div>`;
  }).join("") : `<div class="empty">هنوز هزینه‌ای ثبت نشده. با دکمه + شروع کنید.</div>`;

  const by = {}; items.forEach((i) => (by[i.cat] = (by[i.cat] || 0) + i.amt));
  const ents = Object.entries(by).sort((a, b) => b[1] - a[1]);
  const COL = ents.map(([c]) => catOf(c).c);
  let dn = "";
  if (ents.length) { const R = 62, C = 2 * Math.PI * R; let off = 0;
    dn = `<svg class="donut" viewBox="0 0 170 170"><g transform="rotate(-90 85 85)"><circle cx="85" cy="85" r="${R}" fill="none" stroke="rgba(0,0,0,.3)" stroke-width="26"/>` +
      ents.map(([c, v], k) => { const l = v / exp * C, x = `<circle cx="85" cy="85" r="${R}" fill="none" stroke="${COL[k]}" stroke-width="26" stroke-dasharray="${Math.max(0, l - 1.5)} ${C}" stroke-dashoffset="${-off}"/>`; off += l; return x; }).join("") +
      `</g><text x="85" y="82">هزینه</text><text x="85" y="100" style="font-weight:700">${fa(exp)}</text></svg>`; }
  $("cats").innerHTML = dn + ents.map(([c, v], k) =>
    `<div class="cat"><span><b style="display:inline-block;width:9px;height:9px;border-radius:50%;background:${COL[k]};margin-inline-end:6px"></b>${catOf(c).e} ${esc(c)}</span><span>${fa(v)} · ${fa(v / exp * 100)}٪</span></div><div class="bar"><i style="width:${v / exp * 100}%;background:${COL[k]}"></i></div>`
  ).join("") || `<div class="empty">—</div>`;
  analyze(items, inc, exp);

  drawChart(items, inc);
  $("tips").innerHTML = tips(items, inc, exp).map(([c, t]) => `<div class="tip ${c}">${t}</div>`).join("");
}
function drawChart(items, inc) {
  const L = mLen(cur), mn = MONTHS[cur % 12];
  const byDay = {};
  items.forEach((i) => { const d = Math.min(dayOf(i), L); (byDay[d] = byDay[d] || []).push(i); });
  const days = Object.keys(byDay).map(Number).sort((a, b) => a - b);
  if (!inc && !days.length) { $("chart").innerHTML = '<div class="empty">درآمد و هزینه ثبت کن تا نمودار ساخته شود.</div>'; $("evs").innerHTML = ""; return; }
  const W = 320, H = 170, pl = 8, pr = 8, pt = 16, pb = 22;
  let bal = inc; const pts = [[1, inc]];
  days.forEach((d) => { bal -= byDay[d].reduce((s, i) => s + i.amt, 0); pts.push([d, bal]); });
  const last = pts[pts.length - 1];
  const vals = pts.map((q) => q[1]).concat(0), top = Math.max(...vals, 1), bot = Math.min(...vals);
  const X = (d) => pl + (d - 1) / (L - 1) * (W - pl - pr), Y = (v) => pt + (top - v) / (top - bot || 1) * (H - pt - pb);
  const line = pts.map((q) => `${X(q[0]).toFixed(1)},${Y(q[1]).toFixed(1)}`).join(" ");
  const area = `${X(1)},${Y(Math.min(bot, 0))} ${line} ${X(last[0])},${Y(Math.min(bot, 0))}`;
  const zeroY = Y(0);
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6bd66" stop-opacity=".45"/><stop offset="1" stop-color="#e6bd66" stop-opacity="0"/></linearGradient></defs>`;
  s += `<line x1="${pl}" x2="${W - pr}" y1="${zeroY}" y2="${zeroY}" stroke="rgba(255,255,255,.18)" stroke-dasharray="3 3"/>`;
  s += `<polygon points="${area}" fill="url(#g)"/>`;
  if (last[0] < L) s += `<line x1="${X(last[0])}" y1="${Y(last[1])}" x2="${X(L)}" y2="${Y(last[1])}" stroke="#e6bd66" stroke-opacity=".5" stroke-dasharray="4 4" stroke-width="2"/>`;
  s += `<polyline points="${line}" fill="none" stroke="#e6bd66" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" style="filter:drop-shadow(0 3px 3px rgba(0,0,0,.5))"/>`;
  pts.forEach((q, k) => { s += `<circle cx="${X(q[0])}" cy="${Y(q[1])}" r="${k ? 4 : 5}" fill="${q[1] < 0 ? "#ff7b72" : k ? "#fff3d1" : "#e6bd66"}" stroke="#073724" stroke-width="2"/>`; });
  s += `<text x="${pl}" y="${H - 6}">${fa(1)} ${mn}</text><text x="${W - pr}" y="${H - 6}" text-anchor="end">${fa(L)} ${mn}</text>`;
  s += `<text x="${X(1) + 8}" y="${Math.max(10, Y(inc) - 8)}">شروع: ${fa(inc)}</text>`;
  s += `</svg>`;
  $("chart").innerHTML = s;
  $("evs").innerHTML = days.map((d) => {
    const t = byDay[d].reduce((x, i) => x + i.amt, 0), names = byDay[d].map((i) => esc(i.name)).join("، ");
    return `<div class="ev"><span>${fa(d)} ${mn}</span><span>${fa(t)} تومان خرج — ${names}</span></div>`;
  }).join("");
}
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function tips(items, inc, exp) {
  const out = [];
  if (!inc || !items.length) return [["", "با ثبت درآمد و هزینه، هشدارها اینجا نمایش داده می‌شود."]];
  const left = inc - exp;
  if (left < 0) out.push(["b", `⚠️ خرج‌هایت <b>${fa(-left)}</b> تومان از درآمد بیشتر است.`]);

  const inst = items.filter((i) => i.cat === "قسط و وام").reduce((s, i) => s + i.amt, 0);
  if (inst / inc > 0.35) out.push(["b", `اقساط <b>${fa(inst / inc * 100)}٪</b> درآمدت را می‌خورد (حد امن ≈ ۳۵٪). از گرفتن وام جدید پرهیز کن.`]);
  const house = items.filter((i) => i.cat === "مسکن").reduce((s, i) => s + i.amt, 0);
  if (house / inc > 0.4) out.push(["w", `هزینه مسکن ${fa(house / inc * 100)}٪ درآمد است (معمولاً ≤ ۴۰٪ بهتر است).`]);
  const fun = items.filter((i) => ["تفریح و رستوران", "اشتراک و اپ", "خرید و پوشاک"].includes(i.cat)).reduce((s, i) => s + i.amt, 0);
  if (fun / inc > 0.2) out.push(["w", `تفریح، اشتراک و خرید ${fa(fun / inc * 100)}٪ درآمد است؛ بهتر است زیر ۲۰٪ بماند.`]);
  const subs = items.filter((i) => i.cat === "اشتراک و اپ" && i.rep === 0);
  if (subs.length >= 3) out.push(["", `${fa(subs.length)} اشتراک ماهانه داری؛ اگر همه را استفاده نمی‌کنی، لغو کن.`]);
  const ending = items.filter((i) => i.rep > 1 && i.start + i.rep - 1 === cur);
  ending.forEach((i) => out.push(["g", `🎉 قسط «${esc(i.name)}» این ماه تمام می‌شود؛ ماه بعد ${fa(i.amt)} تومان آزاد می‌شود.`]));
  if (out.length === 0 || (out.length === 1 && left < 0 === false && !out[0])) out.push(["g", "✅ هشدار خاصی وجود ندارد؛ وضعیت متعادل است."]);
  return out;
}

function analyze(items, inc, exp) {
  const el = $("ana");
  if (!inc) { el.innerHTML = '<div class="empty">درآمد این ماه را ثبت کن تا تحلیل دقیق ساخته شود.</div>'; return; }
  if (!items.length) { el.innerHTML = '<div class="empty">هزینه‌ها را ثبت کن تا تحلیل ساخته شود.</div>'; return; }
  const left = inc - exp, rate = left / inc * 100, goalAmt = inc * db.goal / 100, gap = goalAmt - left;
  const st = left < 0 ? "b" : gap > 0 ? "w" : "g";
  let v = left < 0 ? `درآمد <b>${fa(inc)}</b> و خرج <b>${fa(exp)}</b> تومان است؛ <b>${fa(-left)}</b> تومان کسری داری.`
    : `از <b>${fa(inc)}</b> تومان درآمد، <b>${fa(exp)}</b> خرج شده و <b>${fa(left)}</b> تومان (${fa(rate)}٪) می‌ماند.`;
  v += gap > 0 ? ` هدفت ${fa(db.goal)}٪ (${fa(goalAmt)} تومان) است، یعنی <b>${fa(gap)}</b> تومان کم داری.` : ` هدف پس‌اندازت (${fa(goalAmt)} تومان) تامین شده ✅`;
  let h = `<div class="verdict ${st}">${v}</div>
  <div class="stats"><div><small>پس‌انداز فعلی</small><b>${fa(rate)}٪</b></div><div><small>هدف</small><b>${fa(db.goal)}٪</b></div><div><small>پس‌انداز سالانه</small><b>${fa(Math.max(0, left) * 12)}</b></div></div>`;
  const grp = [0, 1, 2].map((n) => items.filter((i) => i.need === n).reduce((s, i) => s + i.amt, 0)), cl = ["#6ee7a0", "#f0b34a", "#ff7b72"];
  h += `<h3>ترکیب درآمد</h3><div class="split">` + grp.map((g, n) => `<i style="width:${g / inc * 100}%;background:${cl[n]}"></i>`).join("") +
    (left > 0 ? `<i style="width:${left / inc * 100}%;background:#e6bd66"></i>` : "") + `</div><div class="leg">` +
    grp.map((g, n) => `<span><b style="background:${cl[n]}"></b>${NEED[n]} ${fa(g / inc * 100)}٪</span>`).join("") + `<span><b style="background:#e6bd66"></b>باقی ${fa(Math.max(0, rate))}٪</span></div>`;
  if (gap > 0) {
    let need = gap, got = 0, steps = "";
    for (const it of items.filter((i) => i.need > 0).sort((a, b) => b.need - a.need || b.amt - a.amt)) {
      if (need <= 0) break;
      const full = it.need === 2, cut = full ? it.amt : it.amt * 0.3; need -= cut; got += cut;
      steps += `<div class="step"><span>${full ? "حذف" : "کاهش ۳۰٪"} «${esc(it.name)}» <small style="color:var(--mut)">(${esc(it.cat)})</small></span><em>+${fa(cut)}</em></div>`;
    }
    h += `<h3>برنامه‌ی پیشنهادی برای رسیدن به هدف</h3>` + (steps || '<div class="empty">مورد قابل حذفی ثبت نشده.</div>') +
      `<div class="step"><b>پس‌انداز بعد از اجرا</b><b class="${left + got >= goalAmt ? "pos" : "neg"}">${fa(left + got)} (${fa((left + got) / inc * 100)}٪)</b></div>`;
    if (need > 0) h += `<div class="tip b" style="margin-top:8px">با حذف موارد غیرضروری هم <b>${fa(need)}</b> تومان کم می‌آید. ضروری‌ها (مسکن، اقساط) را بازنگری کن یا درآمد را بالا ببر.</div>`;
  } else h += `<h3>پیشنهاد</h3><div class="step"><span>پس‌انداز ماهانه‌ی پیشنهادی</span><em>${fa(goalAmt)}</em></div><div class="step"><span>تا ۶ ماه دیگر جمع می‌شود</span><em>${fa(goalAmt * 6)}</em></div><div class="step"><span>تا یک سال</span><em>${fa(goalAmt * 12)}</em></div>`;
  el.innerHTML = h;
}

// --- فرم هزینه ---
let editId = null;
function openForm(it) {
  editId = it ? it.id : null;
  $("dTitle").textContent = it ? "ویرایش هزینه" : "هزینه جدید";
  $("fName").value = it ? it.name : ""; $("fAmt").value = it ? it.amt.toLocaleString("fa-IR") : "";
  const names = db.cats.map((c) => c.n); if (it && !names.includes(it.cat)) names.push(it.cat);
  $("fCat").innerHTML = names.map((n) => `<option value="${esc(n)}">${catOf(n).e} ${esc(n)}</option>`).join("");
  $("fCat").value = it ? it.cat : (names.includes("سایر") ? "سایر" : names[0]); $("fNeed").value = it ? it.need : 0;
  $("fRep").value = it ? (it.rep === 1 ? "1" : it.rep === 0 ? "0" : "n") : "1";
  $("fDay").value = it ? dayOf(it) : (cur === nowIdx() ? todayDay() : 1);
  $("fN").value = it && it.rep > 1 ? it.rep : 12; $("nBox").style.display = $("fRep").value === "n" ? "" : "none";
  $("dlg").showModal();
}
$("fRep").onchange = () => ($("nBox").style.display = $("fRep").value === "n" ? "" : "none");
$("add").onclick = () => openForm();
$("cancel").onclick = () => $("dlg").close();
$("form").onsubmit = () => {
  const r = $("fRep").value;
  const it = { id: editId || Date.now(), name: $("fName").value.trim(), amt: toNum($("fAmt").value), cat: $("fCat").value,
    need: +$("fNeed").value, rep: r === "n" ? Math.max(2, +$("fN").value || 2) : +r, start: cur, day: Math.min(mLen(cur), Math.max(1, +$("fDay").value || 1)) };
  if (!it.name || !it.amt) return;
  if (editId) { const old = db.items.find((x) => x.id === editId); it.start = old.start; db.items[db.items.indexOf(old)] = it; }
  else db.items.push(it);
  save(); render();
};
$("list").onclick = (e) => {
  const d = e.target.dataset;
  if (d.e) openForm(db.items.find((i) => i.id == d.e));
  if (d.d) { const k = db.items.findIndex((i) => i.id == d.d), it = db.items[k]; db.items.splice(k, 1); save(); render(); toast(`«${it.name}» حذف شد`, () => { db.items.splice(k, 0, it); save(); render(); }); }
};
let tT, tFn;
function toast(m, fn) { $("tMsg").textContent = m; tFn = fn; $("toast").classList.add("show"); clearTimeout(tT); tT = setTimeout(() => $("toast").classList.remove("show"), 5000); }
$("tUndo").onclick = () => { if (tFn) tFn(); tFn = null; $("toast").classList.remove("show"); };
["fAmt", "iMain", "iExtra"].forEach((id) => $(id).addEventListener("input", (e) => { const n = toNum(e.target.value); e.target.value = n ? n.toLocaleString("fa-IR") : ""; }));
if (navigator.vibrate) document.addEventListener("click", (e) => { if (e.target.closest(".btn,.fab")) navigator.vibrate(10); });

// --- مدیریت دسته‌بندی ---
let catEdit = null;
function drawCats() {
  $("catList").innerHTML = db.cats.map((c, k) => `<div class="crow"><i style="background:${c.c}33;border:1px solid ${c.c}">${esc(c.e)}</i><span>${esc(c.n)}</span><button data-ce="${k}">✎</button><button data-cd="${k}">🗑</button></div>`).join("");
  $("cEmo").value = ""; $("cName").value = ""; $("cCol").value = "#e6bd66"; catEdit = null; $("cSave").textContent = "افزودن";
}
$("manCats").onclick = () => { drawCats(); $("catDlg").showModal(); };
$("cClose").onclick = () => { $("catDlg").close(); render(); };
$("catDlg").addEventListener("close", render);
$("catList").onclick = (e) => {
  const d = e.target.dataset;
  if (d.ce !== undefined) { const c = db.cats[d.ce]; catEdit = +d.ce; $("cEmo").value = c.e; $("cName").value = c.n; $("cCol").value = c.c; $("cSave").textContent = "ذخیره تغییر"; }
  if (d.cd !== undefined) { if (db.cats.length < 2) return; const c = db.cats[d.cd]; const used = db.items.filter((i) => i.cat === c.n).length;
    if (used && !confirm(`${used} هزینه از این دسته استفاده می‌کند و با ظاهر پیش‌فرض نمایش داده می‌شود. حذف شود؟`)) return;
    db.cats.splice(d.cd, 1); save(); drawCats(); }
};
$("cSave").onclick = () => {
  const n = $("cName").value.trim(); if (!n) return;
  if (db.cats.some((c, k) => c.n === n && k !== catEdit)) { alert("این نام تکراری است."); return; }
  const o = { n, e: $("cEmo").value.trim() || "📦", c: $("cCol").value };
  if (catEdit !== null) { const old = db.cats[catEdit].n; if (old !== n) db.items.forEach((i) => { if (i.cat === old) i.cat = n; }); db.cats[catEdit] = o; }
  else db.cats.push(o);
  save(); drawCats();
};

// --- درآمد ---
$("editInc").onclick = () => {
  const c = db.income[cur];
  $("iMain").value = c ? c.main.toLocaleString("fa-IR") : ""; $("iExtra").value = c && c.extra ? c.extra.toLocaleString("fa-IR") : "";
  $("iCarry").checked = c ? c.carry : true; $("incDlg").showModal();
};
$("incForm").onsubmit = () => {
  db.income[cur] = { main: toNum($("iMain").value), extra: toNum($("iExtra").value), carry: $("iCarry").checked };
  save(); render();
};

// --- ناوبری و تنظیمات ---
const go = (d) => { cur += d; document.querySelector("main").style.setProperty("--dx", d * -24 + "px"); render();
  document.querySelectorAll(".card").forEach((c) => { c.classList.remove("slide"); void c.offsetWidth; c.classList.add("slide"); c.style.animation = "none"; c.style.animation = ""; }); };
$("prev").onclick = () => go(-1);
$("next").onclick = () => go(1);
$("goal").onchange = () => { db.goal = Math.min(90, Math.max(0, +$("goal").value || 0)); save(); render(); };
$("export").onclick = () => {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([JSON.stringify(db)], { type: "application/json" }));
  a.download = "hesabrun-backup.json"; a.click();
};
$("import").onclick = () => $("file").click();
$("file").onchange = async () => {
  try {
    const d = JSON.parse(await $("file").files[0].text());
    if (!Array.isArray(d.items) || typeof d.income !== "object") throw 0;
    db = d; if (!Array.isArray(db.cats)) db.cats = DEFCATS.map(([n,e,c]) => ({ n, e, c })); save(); render(); alert("بازیابی شد.");
  } catch { alert("فایل معتبر نیست."); }
};

// --- نصب PWA ---
let deferred;
addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); deferred = e; $("install").style.display = "block"; });
$("install").onclick = async () => { if (deferred) { deferred.prompt(); deferred = null; $("install").style.display = "none"; } };
if (/iphone|ipad/i.test(navigator.userAgent) && !navigator.standalone) $("iosHint").style.display = "block";
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});

render();
setTimeout(() => $("splash").classList.add("hide"), 2000);
</script>
</body>
</html>
